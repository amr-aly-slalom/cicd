      - name: Deploy mwaa
        uses: ./.github/actions/tf-deploy
        with:
          stack: mwaa
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_mwaa }}
          setup-python: "true"

  deploy-lakeformation:
    name: deploy-lakeformation
    needs: [build, deploy-core, deploy-redshift, deploy-s3tables]
    if: inputs.ordered && needs.build.outputs.uploaded_url_lakeformation != ''
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-lakeformation', inputs.environment) || inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy lakeformation
        uses: ./.github/actions/tf-deploy
        with:
          stack: lakeformation
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_lakeformation }}

  deploy-lakeformation-standalone:
    name: deploy-lakeformation
    needs: [build]
    if: ${{ !inputs.ordered && needs.build.outputs.uploaded_url_lakeformation != '' }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-lakeformation', inputs.environment) || inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy lakeformation
        uses: ./.github/actions/tf-deploy
        with:
          stack: lakeformation
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_lakeformation }}

  # dev only, as before - the post-deploy-tests role exists per environment
  # (terraform/post_deploy_tests.tf), but the suite has only ever gated dev.
  post-deploy-tests:
    name: post-deploy-tests
    needs: [deploy-core]
    if: inputs.environment == 'dev'
    runs-on: [ self-hosted, aws, cloud-platform, xlarge, x64 ]
    environment: "${{ inputs.environment }}-post-deploy-tests"
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run post-deploy tests
        uses: ./.github/actions/post-deploy-tests
        with:
          environment: ${{ inputs.environment }}
