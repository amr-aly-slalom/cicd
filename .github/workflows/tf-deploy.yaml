    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-kafka', inputs.environment) || inputs.environment }}
    timeout-minutes: 120 # MSK broker updates roll one broker at a time and can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy kafka
        uses: ./.github/actions/tf-deploy
        with:
          stack: kafka
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_kafka }}

  deploy-mwaa:
    name: deploy-mwaa
    needs: [build, deploy-core, deploy-redshift]
    if: inputs.ordered && needs.build.outputs.uploaded_url_mwaa != ''
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-mwaa', inputs.environment) || inputs.environment }}
    timeout-minutes: 45 # MWAA provisioning takes 20-30 min on first apply
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy mwaa
        uses: ./.github/actions/tf-deploy
        with:
          stack: mwaa
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_mwaa }}
          setup-python: "true"

  deploy-mwaa-standalone:
    name: deploy-mwaa
    needs: [build]
    if: ${{ !inputs.ordered && needs.build.outputs.uploaded_url_mwaa != '' }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-mwaa', inputs.environment) || inputs.environment }}
    timeout-minutes: 45 # MWAA provisioning takes 20-30 min on first apply
    steps:
      - name: Checkout code
