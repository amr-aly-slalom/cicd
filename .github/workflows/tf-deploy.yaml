      # Runs here, after every stack's own `terraform init`/plan above, not
      # earlier alongside the other static checks, so any local .tf gets
      # scanned against a real checkout. --tf-exclude-downloaded-modules
      # stops trivy evaluating vendored module sources at all - confirmed,
      # not assumed, this is needed for two reasons: (1) without it, trivy
      # does its OWN remote module resolution independent of whatever
      # `terraform init` above already fetched into .terraform/modules/,
      # and a real local run hung for minutes trying to `git clone`
      # terraform-aws-modules/terraform-aws-s3-bucket straight from
      # github.com - this runner's proxy config should carry through here
      # (unlike inside `docker build`'s isolated network namespace - see
      # docker/ci-image/Dockerfile), but there's no reason to make trivy
      # redo module resolution `terraform init` already did; (2) it also
      # cuts out findings against that vendored module's own code (a real
      # ruleset/behaviour difference from checkov, not something this
      # repo's commits control anyway - it's third-party code). --skip-dirs
      # additionally excludes the raw .terraform/ dirs themselves (provider
      # binaries etc.) from being walked at all. --exit-code 1: trivy's own
      # default exit code is 0 regardless of findings; this restores
      # checkov's hard-fail-on-findings behaviour. Independent of whether
      # any given stack's plan above was skipped (upstream not deployed
      # yet) - scans whatever .tf files exist in the checkout either way.
      - name: Run Trivy
        if: inputs.static_checks
        run: trivy config --exit-code 1 --skip-dirs '**/.terraform/**' --tf-exclude-downloaded-modules ./terraform

      # Hands the checkout back to the runner's own non-root user for the
      # next, non-container job that touches this same persistent checkout.
      # Placed at the END of the job, not right after Checkout, so it also
      # catches everything else this job writes as root along the way
      # (.terraform/ dirs, tfapply files, Trivy's cache) - an earlier
      # version only chowned right after Checkout and left exactly these
      # later writes root-owned, breaking the next job's own checkout
      # anyway. This job no longer runs any raw git commands itself (the
      # per-stack diffing that used to live here moved to prepare - see its
      # own comment for why: doing it here, as root, hit git's "detected
      # dubious ownership" refusal against this same shared checkout on a
      # real run), so there's no longer a risk of a mid-job chown breaking
      # a LATER step in this job the way there would have been before.
      # if: always() so this still runs even if an earlier step (e.g. Run
      # Trivy) failed - a failed build shouldn't leave the workspace stuck
      # for every run after it.
      - name: Fix workspace ownership for later non-container jobs
        if: always()
        run: chown -R ${{ needs.prepare.outputs.runner-uid }}:${{ needs.prepare.outputs.runner-gid }} "$GITHUB_WORKSPACE"

  # One approval for the whole release, given after build so the plans in its
  # log can be reviewed first. Every ordered deploy job waits on deploy-core,
  # which waits on this, so nothing applies until it's approved.
  approve:
    name: approve
    needs: [build]
    if: inputs.approval != 'per-stack' && inputs.approval != 'none'
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: "${{ inputs.environment }}-deploy"
    timeout-minutes: 5
    steps:
      - name: Approved
        run: echo "Deploying ${{ inputs.environment }} at ${{ github.sha }}"

  deploy-core:
    name: deploy-core
    needs: [build, approve]
    # approve is skipped for per-stack and none; for anything else it must
    # have succeeded. uploaded_url_core != '': every other stack's deploy
    # job already skips when its plan was skipped (see prepare's own
    # plan_<stack> outputs) - core was missing this same check, a
    # pre-existing gap that only became visible once core's own plan could
    # legitimately be skipped too (previously it almost never was).
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.uploaded_url_core != '' && (needs.approve.result == 'success' || (needs.approve.result == 'skipped' && (inputs.approval == 'per-stack' || inputs.approval == 'none'))) }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-core', inputs.environment) || inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy core
        uses: ./.github/actions/tf-deploy
        with:
          stack: core
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_core }}

  deploy-redshift:
    name: deploy-redshift
    needs: [build, deploy-core]
    if: inputs.ordered && needs.build.outputs.uploaded_url_redshift != ''
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-redshift', inputs.environment) || inputs.environment }}
    timeout-minutes: 90 # a Redshift cluster resize or node-type change can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy redshift
        uses: ./.github/actions/tf-deploy
        with:
          stack: redshift
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_redshift }}

  deploy-redshift-standalone:
    name: deploy-redshift
    needs: [build]
    if: ${{ !inputs.ordered && needs.build.outputs.uploaded_url_redshift != '' }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-redshift', inputs.environment) || inputs.environment }}
    timeout-minutes: 90 # a Redshift cluster resize or node-type change can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy redshift
        uses: ./.github/actions/tf-deploy
        with:
          stack: redshift
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_redshift }}

