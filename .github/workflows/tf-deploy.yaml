name: Terraform build and deploy (one environment)

# One environment's whole pipeline - build (static checks and every stack's
# plan), then a deploy job per stack, then post-deploy tests in dev - called
# once per environment from terraform.yaml (dev, test) and release.yaml (uat,
# prod). Being one reusable workflow per
# environment is what groups its jobs under a single "dev" / "test" / "uat"
# entry in the run view, with checks named "dev / build", "dev / deploy-core"
# and so on. The deploy jobs are defined here rather than as further reusable
# workflow calls, because every extra workflow_call level adds another segment
# to a check's name; their shared steps live in .github/actions/tf-deploy.
#
# Approval depends on inputs.approval (see its comment below):
#   - per-stack (feature branches): each deploy job has its own GitHub
#     environment, "<env>-tfapply-<stack>". GitHub's required-reviewers gate
#     is per (run, environment name), so jobs sharing one environment would
#     release together on a single approval, defeating independent
#     per-component approval.
#   - none (dev on main) and once (test/uat/prod): deploy jobs use the plain,
#     unprotected "<env>" environment; for once, the approve job's
#     "<env>-deploy" environment is the single gate.
# Every protected environment named here must already exist with required
# reviewers - GitHub auto-creates a missing environment on first use, with no
# protection at all. (The per-stack names still say "tfapply"; renaming them
# means recreating their protection rules.)
#
# Deploy jobs come in two variants per stack, with the same display name, of
# which exactly one runs:
#   - ordered: needs its upstream deploys (core; redshift for mwaa and
#     lakeformation, s3tables for lakeformation, and s3 for kafka, which read
#     their outputs). Used whenever inputs.ordered is
#     true: main and every environment after dev.
#   - standalone: needs only build, so it's approvable without waiting on the
#     other components - for feature branches, where you may want to apply one
#     component without the others. `needs` always blocks scheduling on the
#     needed job finishing, even under a permissive `if:`, so this can't be a
#     single job.
# Both variants are skipped when their stack's plan was skipped (build leaves
# its uploaded_url_<stack> empty when an upstream stack isn't deployed yet -
# see .github/scripts/tf-upstreams-deployed.sh), before the approval gate.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      # The static-check steps in build (fmt, TFLint, Checkov, ruff, mypy,
      # pytest, the YAML/registration validators) depend only on the commit,
      # never on the environment - TFLint even pins TF_WORKSPACE=dev. So they're
      # off by default and terraform.yaml only opts in for dev. test, uat and
      # prod only ever deploy commits on main, which dev already checked when
      # they were pushed.
      static_checks:
        description: "Run the environment-agnostic static checks (lint, typecheck, tests, validators)"
        required: false
        type: boolean
        default: false
      ordered:
        description: "Deploy jobs wait on their upstream stacks' deploys (true: main and later environments; false: dev on feature branches)"
        required: false
        type: boolean
        default: true
      # per-stack: each deploy job waits on its own "<env>-tfapply-<stack>"
      #   environment (feature branches).
      # none: deploy jobs use the unprotected "<env>" environment and run
      #   straight away - the PR merge is the approval (dev on main).
      # once: the approve job waits on "<env>-deploy" after build, then every
      #   deploy job runs in the unprotected "<env>" environment (test, uat,
      #   prod).
      # Any other value is treated like once, so a typo can't skip the gate.
      approval:
        description: "How deploy jobs are approved: per-stack, none or once"
        required: false
        type: string
        default: per-stack

jobs:
  build:
    name: build
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ] # Specify your runner here if using self-hosted
    environment: "${{ inputs.environment }}-tfplan"
    timeout-minutes: 45
    outputs:
      uploaded_url_core: ${{ steps.plan.outputs.s3_location }}
      uploaded_url_redshift: ${{ steps.plan_redshift.outputs.s3_location }}
      uploaded_url_s3tables: ${{ steps.plan_s3tables.outputs.s3_location }}
      uploaded_url_s3: ${{ steps.plan_s3.outputs.s3_location }}
      uploaded_url_rds: ${{ steps.plan_rds.outputs.s3_location }}
      uploaded_url_kafka: ${{ steps.plan_kafka.outputs.s3_location }}
      uploaded_url_mwaa: ${{ steps.plan_mwaa.outputs.s3_location }}
      uploaded_url_lakeformation: ${{ steps.plan_lakeformation.outputs.s3_location }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: networkanalytics-actions/hashicorp-setup-terraform@v3

      # One shared provider cache for every root module's init. On Linux,
      # terraform init symlinks .terraform/providers/... into this directory
      # instead of unpacking its own copy - the aws provider alone is ~700MB,
      # and a plan job inits three modules, which is what filled the runner's
      # disk. RUNNER_TOOL_CACHE persists between jobs on self-hosted runners,
      # so later runs skip the download entirely.
      #
      # A cached provider is only used if the module's .terraform.lock.hcl has
      # an h1: checksum for this platform (linux_amd64); otherwise init quietly
      # downloads it again. When updating a lock file on another OS, run
      # `terraform providers lock -platform=linux_amd64` so CI keeps hitting
      # the cache.
      - name: Configure Terraform provider cache
        run: |
          cache_dir="${RUNNER_TOOL_CACHE:-$HOME/.cache}/terraform-plugin-cache"
          mkdir -p "$cache_dir"
          echo "TF_PLUGIN_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Setup TFLint
        if: inputs.static_checks
        uses: networkanalytics-actions/terraform-linters-setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: Set up Python and uv
        if: inputs.static_checks
        uses: ./.github/actions/setup-python-uv

      # --locked fails rather than silently re-resolving if uv.lock is stale
      # against pyproject.toml, so CI can't drift from the committed pins.
      - name: Install uv-managed dependencies
        if: inputs.static_checks
        run: uv sync --locked

      # --- Static-Check ---------------------------------------------------

      - name: Terraform Format
        if: inputs.static_checks
        run: make tf-fmt

      - name: Terraform Lint
        if: inputs.static_checks
        run: make tf-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run Checkov
        if: inputs.static_checks
        uses: networkanalytics-actions/bridgecrewio-checkov-action@master
        with:
          directory: ./terraform
          check: CKV_*
          quiet: true
          soft_fail: false
          download_external_modules: true

      # --- Python Checks (edp_dbt plugin) ---------------------------------

      - name: Lint (ruff)
        if: inputs.static_checks
        run: make lint

      - name: Typecheck (mypy --strict)
        if: inputs.static_checks
        run: make typecheck

      - name: Run tests
        if: inputs.static_checks
        run: make test

      # --- Kafka Topics ----------------------------------------------------

      - name: Kafka schema validation
        if: inputs.static_checks
        run: make validate-kafka-schema

      - name: Kafka naming and placement validation — producers
        if: inputs.static_checks
        run: make validate-kafka-topics-producers

      - name: Kafka naming and placement validation — consumers
        if: inputs.static_checks
        run: make validate-kafka-topics-consumers

      - name: Kafka naming and cross-reference validation — connect registrations
        if: inputs.static_checks
        run: make validate-kafka-topics-connect

      # --- S3 Producers ----------------------------------------------------

      - name: Validate S3 registrations
        if: inputs.static_checks
        run: make validate-s3-registrations

      # --- Redshift Namespaces ----------------------------------------------

      - name: Validate Redshift namespace registrations
        if: inputs.static_checks
        run: make validate-redshift-registrations

      # --- Yaml Validation ---------------------------------------------------

      - name: S3Tables yaml validation
        if: inputs.static_checks
        run: make validate-s3tables-yaml

      - name: Lake Formation yaml validation
        if: inputs.static_checks
        run: make validate-lakeformation-yaml

      # --- Terraform Plan ---------------------------------------------------
      #
      # Upstream stacks first, so each dependent stack's check can read their
      # outputs: core, then redshift, s3tables and s3 (need core), then the
      # stacks that need core (rds), core and s3 (kafka), core and redshift
      # (mwaa), or core, redshift and s3tables (lakeformation). A stack
      # whose upstreams aren't deployed in this environment yet - only ever
      # true of a brand-new environment - skips its init and plan, leaves its
      # uploaded_url_* output empty, and terraform.yaml skips its apply. See
      # .github/scripts/tf-upstreams-deployed.sh.

      - name: Terraform Init (core)
        id: init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan (core)
        id: plan
        working-directory: ./terraform
        run: |
          export WORKSPACE="${{ inputs.environment }}"
          terraform workspace select -or-create $WORKSPACE
          terraform plan -lock-timeout=10m -out tfapply
          S3_PATH="chedaws-prod-terraform-state-file/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$WORKSPACE/tfapply"
          echo "s3_location=$S3_PATH" >> $GITHUB_OUTPUT
          aws s3 cp tfapply "s3://$S3_PATH"

      - name: Check upstream stacks are deployed (redshift)
        id: deps_redshift
        run: bash .github/scripts/tf-upstreams-deployed.sh redshift terraform

      - name: Terraform Init (redshift)
        id: init_redshift
        if: steps.deps_redshift.outputs.ready == 'true'
        working-directory: ./terraform/redshift
        run: terraform init

      - name: Terraform Plan (redshift)
        id: plan_redshift
        if: steps.deps_redshift.outputs.ready == 'true'
        working-directory: ./terraform/redshift
        run: |
          export WORKSPACE="${{ inputs.environment }}"
          # -or-create: a brand-new environment's workspace legitimately
          # doesn't exist yet - show what applying from scratch would do.
          terraform workspace select -or-create $WORKSPACE
          terraform plan -lock-timeout=10m -out tfapply
          S3_PATH="chedaws-prod-terraform-state-file/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$WORKSPACE/redshift-tfapply"
          echo "s3_location=$S3_PATH" >> $GITHUB_OUTPUT
          aws s3 cp tfapply "s3://$S3_PATH"

      - name: Check upstream stacks are deployed (s3tables)
        id: deps_s3tables
        run: bash .github/scripts/tf-upstreams-deployed.sh s3tables terraform

      - name: Terraform Init (s3tables)
        id: init_s3tables
        if: steps.deps_s3tables.outputs.ready == 'true'
        working-directory: ./terraform/s3tables
        run: terraform init

      - name: Terraform Plan (s3tables)
        id: plan_s3tables
        if: steps.deps_s3tables.outputs.ready == 'true'
        working-directory: ./terraform/s3tables
        run: |
          export WORKSPACE="${{ inputs.environment }}"
          # -or-create: a brand-new environment's workspace legitimately
          # doesn't exist yet - show what applying from scratch would do.
          terraform workspace select -or-create $WORKSPACE
          terraform plan -lock-timeout=10m -out tfapply
          S3_PATH="chedaws-prod-terraform-state-file/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$WORKSPACE/s3tables-tfapply"
          echo "s3_location=$S3_PATH" >> $GITHUB_OUTPUT
          aws s3 cp tfapply "s3://$S3_PATH"

      - name: Check upstream stacks are deployed (s3)
        id: deps_s3
        run: bash .github/scripts/tf-upstreams-deployed.sh s3 terraform

      - name: Terraform Init (s3)
        id: init_s3
        if: steps.deps_s3.outputs.ready == 'true'
        working-directory: ./terraform/s3
        run: terraform init

      - name: Terraform Plan (s3)
        id: plan_s3
        if: steps.deps_s3.outputs.ready == 'true'
        working-directory: ./terraform/s3
        run: |
          export WORKSPACE="${{ inputs.environment }}"
          # -or-create: a brand-new environment's workspace legitimately
          # doesn't exist yet - show what applying from scratch would do.
          terraform workspace select -or-create $WORKSPACE
          terraform plan -lock-timeout=10m -out tfapply
          S3_PATH="chedaws-prod-terraform-state-file/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$WORKSPACE/s3-tfapply"
          echo "s3_location=$S3_PATH" >> $GITHUB_OUTPUT
          aws s3 cp tfapply "s3://$S3_PATH"

      - name: Check upstream stacks are deployed (rds)
        id: deps_rds
        run: bash .github/scripts/tf-upstreams-deployed.sh rds terraform

      - name: Terraform Init (rds)
        id: init_rds
        if: steps.deps_rds.outputs.ready == 'true'
        working-directory: ./terraform/rds
        run: terraform init

      - name: Terraform Plan (rds)
        id: plan_rds
        if: steps.deps_rds.outputs.ready == 'true'
        working-directory: ./terraform/rds
        run: |
          export WORKSPACE="${{ inputs.environment }}"
          # -or-create: a brand-new environment's workspace legitimately
          # doesn't exist yet - show what applying from scratch would do.
          terraform workspace select -or-create $WORKSPACE
          terraform plan -lock-timeout=10m -out tfapply
          S3_PATH="chedaws-prod-terraform-state-file/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$WORKSPACE/rds-tfapply"
          echo "s3_location=$S3_PATH" >> $GITHUB_OUTPUT
          aws s3 cp tfapply "s3://$S3_PATH"

      - name: Check upstream stacks are deployed (kafka)
        id: deps_kafka
        run: bash .github/scripts/tf-upstreams-deployed.sh kafka terraform terraform/s3

      - name: Terraform Init (kafka)
        id: init_kafka
        if: steps.deps_kafka.outputs.ready == 'true'
        working-directory: ./terraform/kafka
        run: terraform init

      - name: Terraform Plan (kafka)
        id: plan_kafka
        if: steps.deps_kafka.outputs.ready == 'true'
        working-directory: ./terraform/kafka
        run: |
          export WORKSPACE="${{ inputs.environment }}"
          # -or-create: a brand-new environment's workspace legitimately
          # doesn't exist yet - show what applying from scratch would do.
          terraform workspace select -or-create $WORKSPACE
          terraform plan -lock-timeout=10m -out tfapply
          S3_PATH="chedaws-prod-terraform-state-file/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$WORKSPACE/kafka-tfapply"
          echo "s3_location=$S3_PATH" >> $GITHUB_OUTPUT
          aws s3 cp tfapply "s3://$S3_PATH"

      - name: Check upstream stacks are deployed (mwaa)
        id: deps_mwaa
        run: bash .github/scripts/tf-upstreams-deployed.sh mwaa terraform terraform/redshift

      - name: Terraform Init (mwaa)
        id: init_mwaa
        if: steps.deps_mwaa.outputs.ready == 'true'
        working-directory: ./terraform/mwaa
        run: terraform init

      - name: Terraform Plan (mwaa)
        id: plan_mwaa
        if: steps.deps_mwaa.outputs.ready == 'true'
        working-directory: ./terraform/mwaa
        run: |
          export WORKSPACE="${{ inputs.environment }}"
          # -or-create: a brand-new environment's workspace legitimately
          # doesn't exist yet - show what applying from scratch would do.
          terraform workspace select -or-create $WORKSPACE
          terraform plan -lock-timeout=10m -out tfapply
          S3_PATH="chedaws-prod-terraform-state-file/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$WORKSPACE/mwaa-tfapply"
          echo "s3_location=$S3_PATH" >> $GITHUB_OUTPUT
          aws s3 cp tfapply "s3://$S3_PATH"

      - name: Check upstream stacks are deployed (lakeformation)
        id: deps_lakeformation
        run: bash .github/scripts/tf-upstreams-deployed.sh lakeformation terraform terraform/redshift terraform/s3tables

      - name: Terraform Init (lakeformation)
        id: init_lakeformation
        if: steps.deps_lakeformation.outputs.ready == 'true'
        working-directory: ./terraform/lakeformation
        run: terraform init

      - name: Terraform Plan (lakeformation)
        id: plan_lakeformation
        if: steps.deps_lakeformation.outputs.ready == 'true'
        working-directory: ./terraform/lakeformation
        run: |
          export WORKSPACE="${{ inputs.environment }}"
          # -or-create: a brand-new environment's workspace legitimately
          # doesn't exist yet - show what applying from scratch would do.
          terraform workspace select -or-create $WORKSPACE
          terraform plan -lock-timeout=10m -out tfapply
          S3_PATH="chedaws-prod-terraform-state-file/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$WORKSPACE/lakeformation-tfapply"
          echo "s3_location=$S3_PATH" >> $GITHUB_OUTPUT
          aws s3 cp tfapply "s3://$S3_PATH"

  # One approval for the whole release, given after build so the plans in its
  # log can be reviewed first. Every ordered deploy job waits on deploy-core,
  # which waits on this, so nothing applies until it's approved.
  approve:
    name: approve
    needs: [build]
    if: inputs.approval != 'per-stack' && inputs.approval != 'none'
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: "${{ inputs.environment }}-deploy"
    timeout-minutes: 5
    steps:
      - name: Approved
        run: echo "Deploying ${{ inputs.environment }} at ${{ github.sha }}"

  deploy-core:
    name: deploy-core
    needs: [build, approve]
    # approve is skipped for per-stack and none; for anything else it must
    # have succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.approve.result == 'success' || (needs.approve.result == 'skipped' && (inputs.approval == 'per-stack' || inputs.approval == 'none'))) }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-core', inputs.environment) || inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy core
        uses: ./.github/actions/tf-deploy
        with:
          stack: core
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_core }}

  deploy-redshift:
    name: deploy-redshift
    needs: [build, deploy-core]
    if: inputs.ordered && needs.build.outputs.uploaded_url_redshift != ''
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-redshift', inputs.environment) || inputs.environment }}
    timeout-minutes: 90 # a Redshift cluster resize or node-type change can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy redshift
        uses: ./.github/actions/tf-deploy
        with:
          stack: redshift
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_redshift }}

  deploy-redshift-standalone:
    name: deploy-redshift
    needs: [build]
    if: ${{ !inputs.ordered && needs.build.outputs.uploaded_url_redshift != '' }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-redshift', inputs.environment) || inputs.environment }}
    timeout-minutes: 90 # a Redshift cluster resize or node-type change can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy redshift
        uses: ./.github/actions/tf-deploy
        with:
          stack: redshift
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_redshift }}

  deploy-s3tables:
    name: deploy-s3tables
    needs: [build, deploy-core]
    if: inputs.ordered && needs.build.outputs.uploaded_url_s3tables != ''
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-s3tables', inputs.environment) || inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy s3tables
        uses: ./.github/actions/tf-deploy
        with:
          stack: s3tables
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_s3tables }}

  deploy-s3tables-standalone:
    name: deploy-s3tables
    needs: [build]
    if: ${{ !inputs.ordered && needs.build.outputs.uploaded_url_s3tables != '' }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-s3tables', inputs.environment) || inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy s3tables
        uses: ./.github/actions/tf-deploy
        with:
          stack: s3tables
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_s3tables }}

  deploy-s3:
    name: deploy-s3
    needs: [build, deploy-core]
    if: inputs.ordered && needs.build.outputs.uploaded_url_s3 != ''
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-s3', inputs.environment) || inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy s3
        uses: ./.github/actions/tf-deploy
        with:
          stack: s3
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_s3 }}

  deploy-s3-standalone:
    name: deploy-s3
    needs: [build]
    if: ${{ !inputs.ordered && needs.build.outputs.uploaded_url_s3 != '' }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-s3', inputs.environment) || inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy s3
        uses: ./.github/actions/tf-deploy
        with:
          stack: s3
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_s3 }}

  deploy-rds:
    name: deploy-rds
    needs: [build, deploy-core]
    if: inputs.ordered && needs.build.outputs.uploaded_url_rds != ''
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-rds', inputs.environment) || inputs.environment }}
    timeout-minutes: 90 # Oracle RDS modifications (storage, class) can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy rds
        uses: ./.github/actions/tf-deploy
        with:
          stack: rds
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_rds }}

  deploy-rds-standalone:
    name: deploy-rds
    needs: [build]
    if: ${{ !inputs.ordered && needs.build.outputs.uploaded_url_rds != '' }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-rds', inputs.environment) || inputs.environment }}
    timeout-minutes: 90 # Oracle RDS modifications (storage, class) can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy rds
        uses: ./.github/actions/tf-deploy
        with:
          stack: rds
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_rds }}

  deploy-kafka:
    name: deploy-kafka
    needs: [build, deploy-core, deploy-s3]
    if: inputs.ordered && needs.build.outputs.uploaded_url_kafka != ''
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-kafka', inputs.environment) || inputs.environment }}
    timeout-minutes: 120 # MSK broker updates roll one broker at a time and can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy kafka
        uses: ./.github/actions/tf-deploy
        with:
          stack: kafka
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_kafka }}

  deploy-kafka-standalone:
    name: deploy-kafka
    needs: [build]
    if: ${{ !inputs.ordered && needs.build.outputs.uploaded_url_kafka != '' }}
    runs-on: [ self-hosted,aws,cloud-platform,xlarge,x64 ]
    environment: ${{ inputs.approval == 'per-stack' && format('{0}-tfapply-kafka', inputs.environment) || inputs.environment }}
    timeout-minutes: 120 # MSK broker updates roll one broker at a time and can run long
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy kafka
        uses: ./.github/actions/tf-deploy
        with:
          stack: kafka
          environment: ${{ inputs.environment }}
          plan-s3-path: ${{ needs.build.outputs.uploaded_url_kafka }}

