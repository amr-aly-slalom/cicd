name: Publish CI image (one environment)
description: >-
  Fetches and stages every tool docker/ci-image/Dockerfile bakes in, builds
  it, applies terraform/ci-image/ for one environment, and pushes the image
  to that environment's ECR repo. The calling job supplies checkout, the
  runner, and which environment.

inputs:
  environment:
    description: "dev, test, uat or prod - selects the account and the terraform/ci-image/ workspace"
    required: true
  account-id:
    description: "AWS account ID that owns this environment's ECR repo"
    required: true
  terraform-version:
    description: "Terraform CLI version to fetch and bake in"
    required: false
    default: "1.16.3"
  tflint-version:
    description: "tflint version to fetch and bake in"
    required: false
    default: "0.52.0"
  trivy-version:
    description: "Trivy version to fetch and bake in"
    required: false
    default: "0.74.0"
  uv-version:
    description: "uv version used to sync the baked venv"
    required: false
    default: "0.11.25"

runs:
  using: composite
  steps:
    # Every fetch below runs directly on this runner - the SAME network
    # context networkanalytics-actions/hashicorp-setup-terraform and
    # setup-python-uv already use successfully today - not inside
    # `docker build`. Confirmed, not assumed, that this distinction is
    # real: this runner's public-internet egress goes through a proxy
    # (nsproxy.corp.chedha.net:8080), and Docker's build containers do not
    # automatically inherit a host's HTTP_PROXY/HTTPS_PROXY - that's the
    # exact mechanism behind a real timeout fetching Terraform when that
    # curl ran inside a Dockerfile RUN instruction instead of here. See
    # docker/ci-image/Dockerfile's own header comment.
    - name: Detect architecture
      id: arch
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64) echo "terraform=amd64" >> "$GITHUB_OUTPUT"; echo "trivy=64bit" >> "$GITHUB_OUTPUT" ;;
          aarch64) echo "terraform=arm64" >> "$GITHUB_OUTPUT"; echo "trivy=ARM64" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac

    - name: Stage Terraform CLI
      shell: bash
      env:
        TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        ARCH: ${{ steps.arch.outputs.terraform }}
      run: |
        set -euo pipefail
        mkdir -p docker/ci-image/staged-bin
        curl -fsSL -o /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_${ARCH}.zip"
        unzip -o /tmp/terraform.zip -d docker/ci-image/staged-bin/
        chmod +x docker/ci-image/staged-bin/terraform
        rm /tmp/terraform.zip
        docker/ci-image/staged-bin/terraform version

    - name: Stage tflint
      shell: bash
      env:
        TFLINT_VERSION: ${{ inputs.tflint-version }}
        ARCH: ${{ steps.arch.outputs.terraform }}
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/tflint.zip \
          "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_${ARCH}.zip"
        unzip -o /tmp/tflint.zip -d docker/ci-image/staged-bin/
        chmod +x docker/ci-image/staged-bin/tflint
        rm /tmp/tflint.zip

    - name: Stage Trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        TRIVY_ARCH: ${{ steps.arch.outputs.trivy }}
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/trivy.tar.gz \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${TRIVY_ARCH}.tar.gz"
        tar -xzf /tmp/trivy.tar.gz -C docker/ci-image/staged-bin/ trivy
        chmod +x docker/ci-image/staged-bin/trivy
        rm /tmp/trivy.tar.gz

    # `trivy config` downloads its own "checks bundle" from the internet on
    # first use unless already cached (confirmed via a real local test, not
    # assumed) - the same class of build-vs-runtime network risk as
    # Terraform's own download, just discovered later. Priming the cache
    # here, on the runner, and staging it means the Run Trivy step in
    # tf-deploy.yaml never needs to fetch it at all.
    #
    # TRIVY_CACHE_DIR, not trivy's own $HOME-relative default: confirmed
    # directly (the same way as the venv's own interpreter symlink above)
    # that a container: job's $HOME is /github/home, not this step's own -
    # priming straight into the staged directory and pointing the image's
    # own trivy at it via this same env var (see the Dockerfile) sidesteps
    # needing the two to agree on $HOME at all.
    - name: Prime and stage Trivy's checks bundle
      shell: bash
      env:
        TRIVY_CACHE_DIR: ${{ github.workspace }}/docker/ci-image/staged-trivy-cache
      run: |
        set -euo pipefail
        mkdir -p "$TRIVY_CACHE_DIR"
        # A genuinely empty, dedicated scan target - not /tmp, which on a
        # long-lived self-hosted runner (or this action's own local test)
        # can hold a large, unrelated tree from something else entirely,
        # turning a cache-priming call into a real, slow full scan of it.
        EMPTY_DIR="$(mktemp -d)"
        docker/ci-image/staged-bin/trivy config --exit-code 0 "$EMPTY_DIR" >/dev/null
        rmdir "$EMPTY_DIR"

    # This runner IS the same Amazon Linux base the image itself uses, so
    # its own tar/make/git/unzip/gzip/find/zip (and the shared libraries
    # `make` needs beyond libc - AL2023's `make` is built with GNU Guile
    # scripting support, needing libguile/libgc/libltdl that nothing here
    # uses but the binary still requires to start) are already the right
    # glibc build to copy in directly - verified once, not per run, via
    # `ldd` against each of these seven binaries (tar needs libacl/
    # libselinux/libpcre2, git's HTTPS-clone helper (git-core) needs
    # libcurl and its full TLS/Kerberos chain, unzip/zip need libbz2, find
    # needs libselinux/libpcre2 - all already present in the base image via
    # curl's own identical dependencies - only make's Guile trio is
    # genuinely missing). No network involved for any of these, unlike the
    # tools above - a dnf install is still never used, since these runners
    # have no working dnf/yum mirror route at all (EDP-597).
    #
    # find and zip specifically: terraform/mwaa/scripts/mwaa_s3_bootstrap.sh
    # (real production code, not test-only - build_plugins_zip shells out to
    # both, using find's GNU -printf extension for deterministic zip
    # contents) needs them, confirmed by a real `make test` failure (exit
    # 127, "command not found") inside the container the first time build
    # ran there - a gap the earlier, non-containerized `build` job never hit
    # since it ran directly on this same runner, which has always had both.
    - name: Stage host binaries for the Dockerfile to COPY in
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p docker/ci-image/staged-lib docker/ci-image/staged-git-core

        cp /usr/bin/tar /usr/bin/make /usr/bin/git /usr/bin/unzip /usr/bin/gzip \
          /usr/bin/find /usr/bin/zip \
          docker/ci-image/staged-bin/

        cp -r /usr/libexec/git-core/. docker/ci-image/staged-git-core/

        # Globs, not exact names: each is a versioned-file symlink (e.g.
        # libguile-2.2.so.1 -> libguile-2.2.so.1.4.2) - copying both the
        # symlink and its real target is what makes the dynamic linker
        # able to resolve it; the symlink alone would be dangling.
        cp -P /lib64/libguile-2.2.so.1* /lib64/libgc.so.1* /lib64/libltdl.so.7* \
          docker/ci-image/staged-lib/

    # This runner's OWN already-extracted CA trust store - not the image's
    # default (public-CA-only) one. Confirmed, not assumed, this is needed:
    # a real run hit "self-signed certificate in certificate chain" cloning
    # from inside the container, even though the identical `git` binary
    # clones fine directly on this same runner - this org's network path to
    # github.domain.prd.int (and possibly other internal/proxied hosts)
    # terminates at a CA this runner trusts but a fresh amazonlinux:2023
    # doesn't ship. Copying the runner's own extracted bundle, rather than
    # trying to isolate and add just the one relevant CA, guarantees the
    # image ends up trusting exactly what this runner already does.
    - name: Stage this runner's CA trust store
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p docker/ci-image/staged-ca-bundle
        cp /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem \
          docker/ci-image/staged-ca-bundle/

    # Bakes the provider cache for all 8 stacks using the Terraform binary
    # just staged above, run right here on the runner (registry.terraform.io
    # is public internet, same proxy concern as Terraform's own download -
    # see this action's header comment) rather than inside `docker build`.
    # Each stack's own .terraform/ (created as a side effect, in the real
    # checkout) is discarded after - only TF_PLUGIN_CACHE_DIR's actual
    # provider binaries get staged into the image.
    - name: Bake the Terraform provider cache
      shell: bash
      env:
        TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/docker/ci-image/staged-provider-cache
      run: |
        set -euo pipefail
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        TF="${{ github.workspace }}/docker/ci-image/staged-bin/terraform"
        for stack in core kafka lakeformation mwaa rds redshift s3 s3tables; do
          dir=terraform
          [ "$stack" != core ] && dir="terraform/$stack"
          (cd "$dir" && "$TF" init -backend=false -input=false)
          rm -rf "$dir/.terraform"
        done

    # Syncs into a directory INSIDE the build context (not the default
    # project-local .venv, and not setup-python-uv's own $RUNNER_TEMP
    # location - neither is reachable from `docker build`'s context) so
    # the Dockerfile can COPY the finished venv in directly, matching the
    # provider cache above.
    #
    # `uv` itself is ALSO staged, not just the venv it produces: this
    # `pip install uv` runs on the RUNNER's own system Python (to reach
    # PyPI without the proxy issue - see this action's header comment), so
    # the resulting `uv` binary lands in the RUNNER's own filesystem, not
    # the image's. Without staging it too, every `make <target>` in this
    # repo's Makefile (they all call `uv run ...`, not the bare tool)
    # would fail inside a container: job with "uv: command not found",
    # even with the finished venv's own bin/ already on PATH.
    - name: Sync and stage the Python venv
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv-version }}
        UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/docker/ci-image/staged-venv
      run: |
        set -euo pipefail
        python3 -m ensurepip --upgrade
        python3 -m pip install --no-cache-dir "uv==${UV_VERSION}"
        cp "$(command -v uv)" docker/ci-image/staged-bin/
        uv sync --locked

        # uv doesn't install Python INTO the venv - venv/bin/python is an
        # absolute symlink OUT to a separately managed interpreter (`uv
        # python dir`). That absolute path is wherever THIS step happens to
        # run, never the same as a container: job's - GitHub Actions always
        # sets $HOME=/github/home there (confirmed directly: a real, later
        # run's own traceback showed
        # /github/home/.local/share/uv/python/.../subprocess.py), so the
        # symlink baked in here would dangle. Stage the managed interpreter
        # too, and rewrite the symlink to the path it'll actually have once
        # the Dockerfile COPYs it there - not wherever it was staged from.
        UV_PYTHON_DIR="$(uv python dir)"
        REAL_PYTHON="$(readlink -f docker/ci-image/staged-venv/bin/python3)"
        PYTHON_SUBPATH="${REAL_PYTHON#"$UV_PYTHON_DIR"/}"
        mkdir -p docker/ci-image/staged-uv-python
        cp -a "$UV_PYTHON_DIR/." docker/ci-image/staged-uv-python/
        ln -sf "/github/home/.local/share/uv/python/$PYTHON_SUBPATH" docker/ci-image/staged-venv/bin/python

        # Every console-script entry point uv/pip installs (pytest, ruff,
        # ty, check-jsonschema, ...) gets a shebang baked in at this exact
        # absolute staging path, not wherever it'll actually live -
        # confirmed directly: `make test` failed with "Failed to spawn:
        # pytest" even though the file plainly exists and is on PATH,
        # because its own first line still read
        # "#!<this-checkout-path>/docker/ci-image/staged-venv/bin/python".
        # /opt/venv is the one absolute path guaranteed correct regardless
        # of where staging happens - it's what UV_PROJECT_ENVIRONMENT is
        # set to in the Dockerfile, fixed independently of this step.
        for f in docker/ci-image/staged-venv/bin/*; do
          [ -L "$f" ] && continue
          head -c 2 "$f" | grep -q '^#!' || continue
          sed -i "1s|^#!.*|#!/opt/venv/bin/python3|" "$f"
        done

    - name: Build image
      shell: bash
      run: docker build -f docker/ci-image/Dockerfile -t ci-image:local .

    # Captures the repo URL here and now, not in a later step: this apply's
    # backend calls go through the provider block's own internal
    # chedaws-edp-ci-runner assume_role (session INFRA_BUILD_CI_IMAGE,
    # matching every other stack's own providers.tf convention). A second
    # `terraform output` call from a later step, after the next step below
    # has exported explicit AWS_* env vars, would use THOSE credentials
    # directly instead - env vars take priority in the AWS SDK's credential
    # chain, bypassing the provider's own assume_role entirely - under a
    # different, non-conforming session name the state bucket's policy may
    # not trust the same way. Confirmed, not assumed: a real run hit exactly
    # this, with the apply itself succeeding (including this same output)
    # and only the later, separate `terraform output` call failing.
    - name: Terraform apply (ensures the ECR repo exists)
      id: apply
      shell: bash
      working-directory: terraform/ci-image
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        TF="${{ github.workspace }}/docker/ci-image/staged-bin/terraform"
        "$TF" init -input=false
        "$TF" workspace select -or-create "$ENVIRONMENT"
        "$TF" apply -input=false -auto-approve
        echo "repo_url=$("$TF" output -raw ci_image_repository_url)" >> "$GITHUB_OUTPUT"

    # Assume and push in ONE step (export, not $GITHUB_ENV) rather than
    # two: .github/actions/publish-mwaa-artefact already documents, from a
    # real incident, that credentials assumed in a separate step did not
    # reliably reach a later step's runtime on this org's runners - one
    # shell process makes the ordering unambiguous. Same reason that
    # action doesn't use aws-actions/configure-aws-credentials either.
    #
    # The provider block above (in terraform/ci-image/providers.tf) already
    # assumes chedaws-edp-ci-runner itself for the apply, using whatever
    # base credentials this runner already has - but the raw `aws ecr`/
    # `docker login` calls below aren't Terraform, so they need real
    # exported credentials in this same shell. The EC2 instance profile
    # itself likely doesn't have ECR access directly, hence assuming this
    # role explicitly here too.
    #
    # ::add-mask:: on each credential immediately after extracting it:
    # dynamically-generated values like these are NOT automatically masked
    # by GitHub Actions the way a pre-registered `secrets.*` value is -
    # confirmed, not assumed, that skipping this let them appear in a real
    # run's logs.
    - name: Assume chedaws-edp-ci-runner and push to ECR
      shell: bash
      env:
        ROLE_ARN: arn:aws:iam::${{ inputs.account-id }}:role/chedaws-edp-ci-runner
        ENVIRONMENT: ${{ inputs.environment }}
        AWS_REGION: ap-southeast-2
        ACCOUNT_ID: ${{ inputs.account-id }}
        REPO_URL: ${{ steps.apply.outputs.repo_url }}
      run: |
        set -euo pipefail
        creds="$(aws sts assume-role \
          --role-arn "$ROLE_ARN" \
          --role-session-name "publish-ci-image-${ENVIRONMENT}" \
          --duration-seconds 3600 \
          --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
          --output text)"
        access_key_id="$(echo "$creds" | awk '{print $1}')"
        secret_access_key="$(echo "$creds" | awk '{print $2}')"
        session_token="$(echo "$creds" | awk '{print $3}')"
        echo "::add-mask::$access_key_id"
        echo "::add-mask::$secret_access_key"
        echo "::add-mask::$session_token"
        export AWS_ACCESS_KEY_ID="$access_key_id"
        export AWS_SECRET_ACCESS_KEY="$secret_access_key"
        export AWS_SESSION_TOKEN="$session_token"

        aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

        docker tag ci-image:local "${REPO_URL}:${GITHUB_SHA}"
        docker tag ci-image:local "${REPO_URL}:latest"
        docker push "${REPO_URL}:${GITHUB_SHA}"
        docker push "${REPO_URL}:latest"
