apiVersion: s3.chedaws.io/v1
kind: Table
metadata:
  namespace: platform
  name: e2e_avro
  owner: platform-team
  description: E2E canary table for Avro format validation
spec:
  format: avro
  schema:
    columns:
      - name: id
        type: int
        comment: "Stable sort and filter key for E2E validation"
      - name: name
        type: string
      - name: value
        type: double
      - name: active
        type: boolean
